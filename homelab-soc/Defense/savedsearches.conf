# =====================================================================
# Splunk Saved Searches & Automated Alerts Configuration (savedsearches.conf)
# Portfolio Home Lab - SIEM / Blue Team Operations
# =====================================================================

[ssh_brute_force_detection]
action.email.sendpdf = 0
action.email.sendresults = 0
action.script = 0
alert.severity = 3
alert.suppress = 0
alert.track = 1
cron_schedule = */5 * * * *
description = Detects multiple SSH failed login attempts from a single source IP within a 5-minute window.
dispatch.earliest_time = -10m
dispatch.latest_time = now
display.general.type = statistics
display.page.search.tab = statistics
enableSched = 1
request.ui_dispatch_app = search
request.ui_dispatch_view = search
search = index=main (sourcetype=linux_secure OR sourcetype=auth) "Failed password" | stats count by src_ip, user | where count >= 5 | sort -count

[dvwa_brute_force_detection]
action.email.sendpdf = 0
action.email.sendresults = 0
alert.severity = 3
alert.suppress = 0
alert.track = 1
cron_schedule = */5 * * * *
description = Detects high frequency of HTTP 401 Unauthorized responses on DVWA login endpoints indicating web brute-forcing.
dispatch.earliest_time = -10m
dispatch.latest_time = now
display.general.type = statistics
enableSched = 1
request.ui_dispatch_app = search
request.ui_dispatch_view = search
search = index=main sourcetype=access_combined status=401 | stats count by clientip, uri | where count > 10 | sort -count

[gobuster_fuzzing_detection]
action.email.sendpdf = 0
action.email.sendresults = 0
alert.severity = 2
alert.suppress = 0
alert.track = 1
cron_schedule = */5 * * * *
description = Detects directory/file fuzzing via GoBuster or Dirb resulting in massive HTTP 404 or unusual scanning patterns.
dispatch.earliest_time = -10m
dispatch.latest_time = now
display.general.type = statistics
enableSched = 1
request.ui_dispatch_app = search
request.ui_dispatch_view = search
search = index=main sourcetype=access_combined (status=404 OR status=403) | stats count by clientip | where count > 50 | sort -count

[sql_injection_detection]
action.email.sendpdf = 0
action.email.sendresults = 0
alert.severity = 4
alert.suppress = 0
alert.track = 1
cron_schedule = */1 * * * *
description = Detects common SQL Injection payloads in HTTP request URIs (UNION SELECT, tautologies).
dispatch.earliest_time = -5m
dispatch.latest_time = now
display.general.type = statistics
enableSched = 1
request.ui_dispatch_app = search
request.ui_dispatch_view = search
search = index=main sourcetype=access_combined (uri="*UNION*SELECT*" OR uri="*OR*=*'" OR uri="*'%20OR%20*'1'='1*") | stats count by clientip, uri | sort -count

[xss_attack_detection]
action.email.sendpdf = 0
action.email.sendresults = 0
alert.severity = 3
alert.suppress = 0
alert.track = 1
cron_schedule = */1 * * * *
description = Detects Cross-Site Scripting (XSS) payload injection attempts in HTTP request URIs or parameters.
dispatch.earliest_time = -5m
dispatch.latest_time = now
display.general.type = statistics
enableSched = 1
request.ui_dispatch_app = search
request.ui_dispatch_view = search
search = index=main sourcetype=access_combined (uri="*%3Cscript%3E*" OR uri="*<script>*") | stats count by clientip, uri | sort -count

[auditd_sensitive_file_modification]
action.email.sendpdf = 0
action.email.sendresults = 0
alert.severity = 5
alert.suppress = 0
alert.track = 1
cron_schedule = */5 * * * *
description = Detects unauthorized or suspicious modifications to critical system files (/etc/passwd, /etc/shadow, /etc/sudoers) via Auditd.
dispatch.earliest_time = -10m
dispatch.latest_time = now
display.general.type = statistics
enableSched = 1
request.ui_dispatch_app = search
request.ui_dispatch_view = search
search = index=main (key=passwd_changes OR key=shadow_changes OR key=sudoers_changes) | table _time, host, exe, uid, success, key | sort - _time
